name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Raycast JS runtime syntax & unit tests
        run: |
          node --check app/src/main/assets/raycast/runtime.js
          node scripts/test-raycast-runtime.mjs

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests & vital release lint
        run: ./gradlew testDebugUnitTest :app:lintVitalRelease --no-daemon --no-configuration-cache
